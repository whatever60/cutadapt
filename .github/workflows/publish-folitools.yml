name: publish-folitools

# Publishes the cutadapt-folitools distribution to PyPI / TestPyPI on tags
# of the form `folitools-v*` (e.g. `folitools-v5.3.1.post0`). The
# tag-name prefix is intentionally distinct from upstream cutadapt's
# `v<version>` scheme so this workflow can coexist on the fork without
# clashing if upstream tags are ever mirrored into the fork.

on:
  push:
    tags:
      - "folitools-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (PEP 440), e.g. 5.3.1.post0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-dist:
    name: Build sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # setuptools_scm still runs even when PRETEND_VERSION is set

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Derive version from tag or input
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#folitools-v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing cutadapt-folitools==$version"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: python -m build --sdist

      - name: Check distribution
        run: python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/*

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build-dist
    permissions:
      id-token: write
    environment: testpypi

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-testpypi
    permissions:
      id-token: write
    environment: pypi

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
